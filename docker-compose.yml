version: "3.9"

services:
  regnis-birthday:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: regnis-birthday-app
    restart: always                      # Auto-start on host reboot
    ports:
      - "5000:5000"                      # Change left side to remap host port (e.g. "80:5000")
    env_file:
      - .env                             # Reads TEXTLK_API_TOKEN, TEXTLK_SENDER_ID, PORT etc.
    environment:
      - NODE_ENV=production
    volumes:
      - regnis_data:/app/data            # Persist db.json across restarts
      - regnis_uploads:/app/uploads      # Persist temp uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/state"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  regnis_data:
    driver: local
  regnis_uploads:
    driver: local
